<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Gestión de Memoria - SO</title>
  <link rel="stylesheet" href="style.css">
  <script src="logic.js"></script>
</head>
<body>

  <header>
    <h1>Simulador de Gestión de Memoria Principal (16 MiB)</h1>
    <span id="current-mode-label" style="font-size: 0.85rem; color: var(--text-muted);">Configuración inicial</span>
  </header>

  <!-- ETAPA 1: CONFIGURACIÓN INICIAL -->
  <div id="setup-stage" class="config-container">
    <h2 style="margin-bottom: 1rem; color: var(--accent);">Parámetros de Simulación</h2>
    
    <div class="form-group">
      <label for="mem-type">Tipo de Gestión de Memoria</label>
      <select id="mem-type" onchange="handleTypeChange()">
        <option value="fixed-static">Particiones Estáticas de Tamaño Fijo</option>
        <option value="variable-static">Particiones Estáticas de Tamaño Variable</option>
        <option value="dynamic">Particiones Dinámicas</option>
      </select>
    </div>

    <div class="form-group">
      <label for="os-size">Memoria Reservada para SO (KiB)</label>
      <input type="number" id="os-size" value="2048" min="512" max="4096">
      <small style="color: var(--text-muted);">Por defecto: 2048 KiB (2 MiB)</small>
    </div>

    <div class="form-group">
      <label for="fit-algorithm">Algoritmo de Asignación</label>
      <select id="fit-algorithm">
        <option value="first-fit">Primer Ajuste (First Fit)</option>
        <option value="best-fit">Mejor Ajuste (Best Fit)</option>
        <option value="worst-fit">Peor Ajuste (Worst Fit)</option>
      </select>
    </div>

    <!-- Opciones específicas: Estática Fija -->
    <div id="field-fixed-static" class="dynamic-field" style="display: block;">
      <div class="form-group">
        <label for="block-size">Tamaño de cada Partición Fija (KiB)</label>
        <input type="number" id="block-size" value="2048" step="256">
      </div>
    </div>

    <!-- Opciones específicas: Estática Variable -->
    <div id="field-variable-static" class="dynamic-field">
      <div class="form-group">
        <label for="partition-sizes">Tamaños de las Particiones separadas por coma (KiB)</label>
        <input type="text" id="partition-sizes" placeholder="1024, 2048, 4096, 3072, 4096">
      </div>
    </div>

    <!-- Opciones específicas: Dinámica -->
    <div id="field-dynamic" class="dynamic-field">
      <div class="form-group">
        <label for="compaction-option">Estrategia de Compactación</label>
        <select id="compaction-option">
          <option value="without">Sin Compactación</option>
          <option value="with">Con Compactación Automática</option>
        </select>
      </div>
    </div>

    <button class="btn-primary" onclick="startSimulation()">Iniciar Simulación</button>
  </div>

  <!-- ETAPA 2: DASHBOARD SIMULACIÓN -->
  <div id="simulation-stage" class="simulation-layout">
    
    <!-- Izquierda: Programas / Administrador de Tareas -->
    <div class="panel">
      <div class="panel-title">Programas Simulados</div>
      <div id="task-list" class="task-list">
        <!-- Renderizado dinámico vía JS -->
      </div>
    </div>

    <!-- Centro: Tabla de Particiones / Fragmentación -->
    <div class="panel">
      <div class="panel-title">Tabla de Estado de Particiones</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID / Dir. Inicio</th>
              <th>Tamaño Total</th>
              <th>Proceso</th>
              <th>Uso / Frag. Int.</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="partition-table-body">
            <!-- Renderizado dinámico vía JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Derecha: Pila / Mapa Físico de Memoria (0x000000 - 0xFFFFFF) -->
    <div class="panel">
      <div class="panel-title">Mapa de Memoria (16 MiB)</div>
      <div id="memory-stack" class="memory-stack">
        <!-- Visualización en pila vía JS -->
      </div>
    </div>

  </div>
</body>
</html>
